name: ccache probe
# Throwaway: finds which clang-cl option ccache refuses on Windows. Not to be merged.
on:
  pull_request:
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: amd64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - name: Tools
        run: |
          choco install ccache -y
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          major=$(clang-cl --version | sed -n 's/^clang version \([0-9]*\)\..*/\1/p' | head -n 1)
          if [ "${major:-0}" -lt 22 ]; then choco upgrade llvm -y; fi
          clang-cl --version
          ccache --version
      - name: Probe
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          export CCACHE_DIR="$RUNNER_TEMP/cc" CCACHE_LOGFILE="$RUNNER_TEMP/cc.log"
          cd "$RUNNER_TEMP"; rm -rf proj; mkdir proj; cd proj
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(p C)\nadd_library(l STATIC a.c b.c)\n' > CMakeLists.txt
          printf '#include <stdio.h>\nint a(void){return 1;}\n' > a.c
          printf '#include <stdio.h>\nint b(void){return 2;}\n' > b.c
          T=--target=x86_64-pc-windows-msvc; [ "${{ matrix.arch }}" = arm64 ] && T=--target=aarch64-pc-windows-msvc
          printf 'set(CMAKE_DEPFILE_FLAGS_C "")\nset(CMAKE_NINJA_DEPTYPE_C msvc)\n' > over.cmake
          run() { name=$1; shift
            for pass in 1 2; do
              rm -rf "b-$name"; ccache -C >/dev/null; [ $pass = 2 ] && true
              :
            done
            rm -rf "b-$name"; ccache -C >/dev/null; ccache -z >/dev/null
            cmake -S . -B "b-$name" -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache "-DCMAKE_C_FLAGS=$T" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "$@" >/dev/null 2>&1 || { echo "== $name: cmake failed"; return; }
            cmake --build "b-$name" >/dev/null 2>&1 || echo "== $name: build failed"
            rm -rf "b-$name"
            cmake -S . -B "b-$name" -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache "-DCMAKE_C_FLAGS=$T" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "$@" >/dev/null 2>&1
            cmake --build "b-$name" >/dev/null 2>&1
            echo "== $name"; ccache --show-stats | grep -i "hits\|misses\|uncacheable\|unsupported"
            grep -c "Result: unsupported" "$CCACHE_LOGFILE" || true
            grep -m2 "deps = \|depfile" "b-$name/build.ninja" || true
          }
          run default
          run override -DCMAKE_PROJECT_INCLUDE="$(cygpath -m "$PWD/over.cmake")"
          ccache --version | head -n 1
