name: Build

# Builds the pinned static lld, opt, llc and llvm-split on a native runner of each of six platforms (see build.sh). Pushing a tag
# `llvm-<version>-r<revision>` that matches llvm-version publishes the assets and a SHA256SUMS file to a release of the
# same name; pull requests and manual runs only build, so a recipe change is proven before it is tagged.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build.sh
      - check-glibc-floor.sh
      - llvm-version
      - .github/workflows/build.yml
  push:
    # Builds on main keep the compiler cache warm: a tag run can only read caches made on the default branch.
    branches: [main]
    paths:
      - build.sh
      - llvm-version
      - .github/workflows/build.yml
    tags:
      - 'llvm-*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Linux builds in AlmaLinux 8 (glibc 2.28), so the tools run on every glibc from 2.28 on; empty elsewhere.
    container: ${{ matrix.container }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64' }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dnf install -y clang lld
            /opt/python/cp312-cp312/bin/pip install ninja cmake
            ln -sf /opt/python/cp312-cp312/bin/ninja /opt/python/cp312-cp312/bin/cmake /usr/local/bin/
            # Fail in a minute, not after an hour, if the compiler cannot build C++ against the gcc-toolset.
            clang --version
            gcc_dir=$(ls -d /opt/rh/gcc-toolset-*/root/usr/lib/gcc/*-redhat-linux/* | sort -V | tail -n 1)
            echo '#include <string>
            int main() { return std::string("a").size() == 1 ? 0 : 1; }' > "$RUNNER_TEMP/probe.cc"
            clang++ -std=c++17 --gcc-install-dir="$gcc_dir" -flto=thin -fuse-ld=lld -static-libstdc++ -static-libgcc "$RUNNER_TEMP/probe.cc" -o "$RUNNER_TEMP/probe"
            "$RUNNER_TEMP/probe"
          elif [ "$RUNNER_OS" = macOS ]; then brew install ninja
          else choco install ninja -y; fi
      - name: Install ccache
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y ccache
          elif [ "$RUNNER_OS" = macOS ]; then brew install ccache
          else choco install ccache -y; fi
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('llvm-version', 'build.sh') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('llvm-version', 'build.sh') }}-
            ccache-${{ matrix.os }}-${{ matrix.arch }}-
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1500M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Build
        run: sh build.sh "${{ matrix.os }}" "${{ matrix.arch }}" | tee build-summary.txt
      - name: Save the compiler cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Keep the sizes for the release notes
        run: sed -n '/^sizes/,$p' build-summary.txt > "dist/sizes-${{ matrix.os }}-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/llvm-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '[:space:]' < llvm-version)
          case "$TAG" in "llvm-$version-r"*) ;; *) echo "tag $TAG does not match llvm-version $version" >&2; exit 1 ;; esac
          cd assets
          cat -- *.sha256 | sort -k2 > SHA256SUMS
          { echo "Static lld, opt, llc and llvm-split for LLVM $version (see build.sh)."; echo; echo '```'; cat sizes-*.txt; echo '```'; } > ../notes.md
          rm -- sizes-*.txt
          cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release can already exist when it was drafted in the UI.
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" --clobber assets/*
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag assets/*
          fi
