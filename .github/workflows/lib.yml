name: Shared library

# Spike: builds the pinned LLVM as one shared library (see build-lib.sh) on a native runner of each of six platforms and runs
# smoke/smoke.c against it. Builds only; nothing is published until the recipe is proven.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build-lib.sh
      - smoke/**
      - llvm-version
      - .github/workflows/lib.yml

permissions:
  contents: read

# A new push to a branch or pull request cancels its older run; a tag build (a release) is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Linux builds in AlmaLinux 8 (glibc 2.28), so the tools run on every glibc from 2.28 on; empty elsewhere.
    container: ${{ matrix.container }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64' }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dnf install -y clang lld
            /opt/python/cp312-cp312/bin/pip install ninja cmake
            ln -sf /opt/python/cp312-cp312/bin/ninja /opt/python/cp312-cp312/bin/cmake /usr/local/bin/
            # Fail in a minute, not after an hour, if the compiler cannot build C++ against the gcc-toolset.
            clang --version
            gcc_dir=$(ls -d /opt/rh/gcc-toolset-*/root/usr/lib/gcc/*-redhat-linux/* | sort -V | tail -n 1)
            echo '#include <string>
            int main() { return std::string("a").size() == 1 ? 0 : 1; }' > "$RUNNER_TEMP/probe.cc"
            clang++ -std=c++17 --gcc-install-dir="$gcc_dir" -flto=thin -fuse-ld=lld -static-libstdc++ -static-libgcc "$RUNNER_TEMP/probe.cc" -o "$RUNNER_TEMP/probe"
            "$RUNNER_TEMP/probe"
          elif [ "$RUNNER_OS" = macOS ]; then brew install ninja
          else choco install ninja -y; fi
      - name: Install ccache
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dnf install -y epel-release && dnf install -y ccache
          elif [ "$RUNNER_OS" = macOS ]; then brew install ccache
          else choco install ccache -y; fi
      - name: Restore the compiler and ThinLTO caches
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
          key: libccache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('llvm-version', 'build-lib.sh') }}-${{ github.run_id }}
          restore-keys: |
            libccache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('llvm-version', 'build-lib.sh') }}-
            libccache-${{ matrix.os }}-${{ matrix.arch }}-
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Build
        run: sh build-lib.sh "${{ matrix.os }}" "${{ matrix.arch }}" | tee build-summary.txt
      - name: Save the compiler and ThinLTO caches
        # Pull requests and tag builds only read: a cache saved there is invisible to other refs, and each save is
        # large enough to push the main-branch cache out of the 10 GB repository limit. A failed build saves nothing, since
        # a newer, empty cache would be restored ahead of a good one; a cancelled one still saves what it compiled.
        if: ${{ false }}
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Keep the sizes for the release notes
        run: sed -n '/^sizes/,$p' build-summary.txt > "dist/sizes-${{ matrix.os }}-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
